<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sigenergy2mqtt — Diagnostics</title>
  <link rel="icon" type="image/x-icon" href="static/favicon.ico">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('s2m-theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) { /* localStorage unavailable — default to dark */ }
    })();
  </script>
  <style>
    :root {
      --bg: #0b1220;
      --bg-panel: #121b2e;
      --bg-card: #16223a;
      --border: #24314d;
      --text: #e6ebf5;
      --text-dim: #8b98b3;
      --accent: #3ddc97;
      --accent-dim: rgba(61, 220, 151, 0.15);
      --warn: #f5a623;
      --warn-dim: rgba(245, 166, 35, 0.15);
      --bad: #ef4b5f;
      --bad-dim: rgba(239, 75, 95, 0.15);
      --unknown: #6b7794;
      --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
      --glow-1: rgba(61, 220, 151, 0.07);
      --glow-2: rgba(58, 123, 213, 0.08);
      --dash-border: rgba(255, 255, 255, 0.05);
      --dash-border-strong: rgba(255, 255, 255, 0.04);
      --header-bg: rgba(18, 27, 46, 0.6);
      --scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #f4f6fb;
      --bg-panel: #ffffff;
      --bg-card: #ffffff;
      --border: #dde3ee;
      --text: #1a2233;
      --text-dim: #5b6579;
      --accent: #1f9d6f;
      --accent-dim: rgba(31, 157, 111, 0.12);
      --warn: #b1720a;
      --warn-dim: rgba(177, 114, 10, 0.12);
      --bad: #c8293e;
      --bad-dim: rgba(200, 41, 62, 0.1);
      --unknown: #7a8499;
      --glow-1: rgba(31, 157, 111, 0.06);
      --glow-2: rgba(58, 123, 213, 0.06);
      --dash-border: rgba(0, 0, 0, 0.06);
      --dash-border-strong: rgba(0, 0, 0, 0.05);
      --header-bg: rgba(255, 255, 255, 0.7);
      --scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: var(--scheme);
    }

    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 15% -10%, var(--glow-1), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, var(--glow-2), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      height: 32px;
      width: auto;
      display: block;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .conn-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--unknown);
      transition: background 0.3s;
    }

    .conn-pill.live .conn-dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .conn-pill.down .conn-dot {
      background: var(--bad);
      box-shadow: 0 0 8px var(--bad);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.1s;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .theme-toggle .icon-moon {
      display: none;
    }

    :root[data-theme="light"] .theme-toggle .icon-sun {
      display: none;
    }

    :root[data-theme="light"] .theme-toggle .icon-moon {
      display: block;
    }

    main {
      padding: 28px 32px 60px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .status-banner {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      margin-bottom: 28px;
    }

    .status-banner .big-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--unknown);
      box-shadow: 0 0 0 6px transparent;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-banner.healthy .big-dot {
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-dim);
    }

    .status-banner.degraded .big-dot {
      background: var(--warn);
      box-shadow: 0 0 0 6px var(--warn-dim);
    }

    .status-banner.unknown .big-dot {
      background: var(--unknown);
    }

    .status-banner .label {
      font-size: 18px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-banner .meta {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 12px;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .pill {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .pill.ok {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .pill.warn {
      background: var(--warn-dim);
      color: var(--warn);
    }

    .pill.bad {
      background: var(--bad-dim);
      color: var(--bad);
    }

    .pill.unknown {
      background: rgba(107, 119, 148, 0.15);
      color: var(--unknown);
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 13px;
      color: var(--text-dim);
      padding: 4px 0;
      border-bottom: 1px dashed var(--dash-border);
    }

    .metric-row:last-child {
      border-bottom: none;
    }

    .metric-row>span:first-child {
      flex-shrink: 0;
    }

    .metric-row .v {
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      text-align: right;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 34px 0 14px;
    }

    .table-wrap {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      text-align: left;
      padding: 10px 18px;
    }

    th {
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }

    td {
      border-bottom: 1px solid var(--dash-border-strong);
      font-family: var(--mono);
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* A provider may nest static/config values under a reserved "config" key
       alongside its live metrics. Those get grouped in the same card under
       this divider, and rendered dimmed/italic (see .config-row) to flag
       them as settings rather than live, changing data. */
    .card-config-divider {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    .card-config-divider svg {
      width: 13px;
      height: 13px;
      opacity: 0.75;
      flex-shrink: 0;
    }

    .metric-row.config-row .v {
      color: var(--text-dim);
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .footer-note {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 40px;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .pulsing {
      animation: pulse 1.6s ease-in-out infinite;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <img src="static/logo.png" alt="sigenergy2mqtt">
      <span class="brand-sub">Diagnostics</span>
    </div>
    <div class="header-right">
      <span class="conn-pill" id="connPill"><span class="conn-dot"></span><span id="connLabel">Connecting…</span></span>
      <a class="btn" href="export" download>⬇ Export JSON</a>
      <a class="btn" href="solar">☀ Solar &amp; Battery</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark theme"
        title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
          </path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div class="status-banner unknown" id="statusBanner">
      <span class="big-dot"></span>
      <span class="label" id="statusLabel">Waiting for data…</span>
      <span class="meta" id="statusMeta"></span>
    </div>

    <div class="grid" id="cardGrid">
      <div class="empty-state pulsing">Waiting for the first diagnostics snapshot…</div>
    </div>
  </main>

  <script>
    (function () {
      const cardGrid = document.getElementById('cardGrid');
      const statusBanner = document.getElementById('statusBanner');
      const statusLabel = document.getElementById('statusLabel');
      const statusMeta = document.getElementById('statusMeta');
      const connPill = document.getElementById('connPill');
      const connLabel = document.getElementById('connLabel');
      const themeToggle = document.getElementById('themeToggle');

      themeToggle.addEventListener('click', () => {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const next = isLight ? 'dark' : 'light';
        if (next === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try { localStorage.setItem('s2m-theme', next); } catch (e) { /* ignore */ }
      });

      function pillClassFor(value) {
        if (value === true || value === 'healthy') return 'ok';
        if (value === false || value === 'degraded') return 'bad';
        if (value === 'unknown' || value === null || value === undefined) return 'unknown';
        return 'warn';
      }

      function fmtVal(v) {
        if (typeof v === 'number') {
          return Number.isInteger(v) ? v.toLocaleString() : v.toFixed(2);
        }
        if (typeof v === 'boolean') return v ? 'yes' : 'no';
        if (v === null || v === undefined) return '—';
        return String(v);
      }

      // Key-suffix -> unit convention. A provider names a field "foo_ms" or
      // "cpu_percent" and gets correct formatting for free — no schema/wrapper
      // object required. Order matters: longer/more specific suffixes first so
      // e.g. "_ms" doesn't accidentally match something ending in "_ms_avg".
      const UNIT_FORMATTERS = [
        { suffix: '_percentage', format: formatPercent },
        { suffix: '_percent', format: formatPercent },
        { suffix: '_pct', format: formatPercent },
        { suffix: '_bytes', format: formatBytes },
        { suffix: '_minutes', format: formatMinutes },
        { suffix: '_ms', format: formatMillis },
        { suffix: '_seconds', format: formatDuration },
        { suffix: '_secs', format: formatDuration },
        { suffix: '_timestamp', format: formatTimestamp },
        { suffix: '_count', format: v => Number(v).toLocaleString() },
      ];

      function formatPercent(v) {
        const n = Number(v);
        return Number.isFinite(n) ? `${n.toFixed(1)}%` : fmtVal(v);
      }

      function formatMillis(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return fmtVal(v);
        return n < 1000 ? `${n.toFixed(n < 10 ? 1 : 0)}ms` : `${(n / 1000).toFixed(2)}s`;
      }

      function formatMinutes(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return fmtVal(v);
        return `${n.toFixed(1)} m`;
      }

      function formatDuration(v) {
        const s = Number(v);
        if (!Number.isFinite(s)) return fmtVal(v);
        if (s < 1) return `${Math.round(s * 1000)}ms`;
        if (s <= 60) return `${s.toFixed(1)}s`;

        const totalSeconds = Math.round(s);
        const d = Math.floor(totalSeconds / 86400);
        const h = Math.floor((totalSeconds % 86400) / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const rem = totalSeconds % 60;

        const parts = [];
        if (d > 0) parts.push(`${d}d`);
        if (h > 0) parts.push(`${h}h`);
        if (m > 0) parts.push(`${m}m`);
        if (rem > 0) parts.push(`${rem}s`);

        return parts.join(' ');
      }

      function formatBytes(v) {
        const b = Number(v);
        if (!Number.isFinite(b)) return fmtVal(v);
        if (b < 1024) return `${b} B`;
        const units = ['KB', 'MB', 'GB', 'TB'];
        let val = b, i = -1;
        do { val /= 1024; i++; } while (val >= 1024 && i < units.length - 1);
        return `${val.toFixed(1)} ${units[i]}`;
      }

      function formatTimestamp(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return fmtVal(v);
        return new Date(n * 1000).toLocaleString();
      }

      // Returns { label, display } — label has the unit suffix stripped (the
      // unit is now visible in the formatted value itself, so keeping it in the
      // label would be redundant), display is the formatted value.
      function formatMetric(rawKey, value) {
        if (typeof value === 'number') {
          const hit = UNIT_FORMATTERS.find(u => rawKey.endsWith(u.suffix));
          if (hit) {
            return { label: rawKey.slice(0, -hit.suffix.length), display: hit.format(value) };
          }
        }
        return { label: rawKey, display: null };
      }

      function humanKey(k) {
        return k.replace(/^sigenergy2mqtt_/, '').replace(/_/g, ' ');
      }

      // Renders one provider's dict as a card. Nested dicts (e.g. per-client
      // connection maps) get flattened one level with a "group.key" label so
      // any future provider "just works" without UI changes.
      function buildCard(name, data) {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('div');
        title.className = 'card-title';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = humanKey(name);
        title.appendChild(nameSpan);

        if (data && typeof data === 'object' && 'status' in data) {
          const pill = document.createElement('span');
          pill.className = 'pill ' + pillClassFor(data.status);
          pill.textContent = data.status;
          title.appendChild(pill);
        } else if (data && typeof data === 'object' && 'error' in data) {
          const pill = document.createElement('span');
          pill.className = 'pill bad';
          pill.textContent = 'error';
          title.appendChild(pill);
        }
        card.appendChild(title);

        // Renders obj's entries as .metric-row elements into `container`.
        // 'config' is skipped here — it's a reserved key handled separately
        // below, so any provider can nest static settings under it without
        // them being mixed into the regular metric flattening.
        function buildRows(obj, prefix, container) {
          Object.entries(obj).forEach(([k, v]) => {
            if (k === 'status' || k === 'config') return;
            if (v && typeof v === 'object' && !Array.isArray(v)) {
              buildRows(v, prefix ? `${prefix}.${k}` : k, container);
              return;
            }
            const row = document.createElement('div');
            row.className = 'metric-row';
            const fullKey = prefix ? `${prefix}.${k}` : k;
            const { label: strippedKey, display } = formatMetric(fullKey, v);
            const label = document.createElement('span');
            label.textContent = humanKey(strippedKey);
            const val = document.createElement('span');
            val.className = 'v';
            if (typeof v === 'boolean') {
              val.innerHTML = `<span class="pill ${pillClassFor(v)}">${fmtVal(v)}</span>`;
            } else if (display !== null) {
              val.textContent = display;
            } else {
              val.textContent = fmtVal(v);
            }
            row.appendChild(label);
            row.appendChild(val);
            container.appendChild(row);
          });
        }

        const rows = document.createElement('div');
        if (data && typeof data === 'object') buildRows(data, '', rows);
        card.appendChild(rows);

        // Reserved "config" key: any provider can attach a "config": {...}
        // sub-object with whatever static settings it wants, no schema
        // required. Rendered in the same card, under a small divider, with
        // values dimmed/italic (see .config-row CSS) to flag them as
        // settings rather than live metrics.
        if (data && typeof data === 'object' && data.config && typeof data.config === 'object' && !Array.isArray(data.config) && Object.keys(data.config).length > 0) {
          const divider = document.createElement('div');
          divider.className = 'card-config-divider';
          divider.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>Configuration</span>';
          card.appendChild(divider);

          const configRows = document.createElement('div');
          buildRows(data.config, '', configRows);
          configRows.querySelectorAll('.metric-row').forEach(r => r.classList.add('config-row'));
          card.appendChild(configRows);
        }

        return card;
      }

      // Providers listed here have their own dedicated page (e.g. "solar" ->
      // /diagnostics/solar) and are deliberately excluded from this page's
      // generic card grid. buildRows()/buildCard() assume a flat "scalar or
      // one level of nesting" shape; a provider designed for its own richer
      // page (nested {value, unit} leaves, per-device sub-objects) would
      // render here as a wall of flattened "a.b.value"/"a.b.unit" rows —
      // and worse, buildRows silently drops any key literally named
      // "config" at ANY nesting depth (not just top-level), so a nested
      // config sub-object would silently vanish rather than just look ugly.
      // Both dashboards still read from the same /diagnostics/ws feed and
      // the provider's data still appears in /diagnostics/export — this only
      // hides it from this page's auto-generated grid.
      const DEDICATED_PAGE_PROVIDERS = new Set(['solar']);

      function render(snapshot) {
        const monitor = snapshot.monitor || {};
        const status = monitor.status || 'unknown';
        statusBanner.className = 'status-banner ' + (status === 'healthy' ? 'healthy' : status === 'degraded' ? 'degraded' : 'unknown');
        statusLabel.textContent = status;
        const ts = snapshot.timestamp ? new Date(snapshot.timestamp * 1000).toLocaleString() : '—';
        statusMeta.textContent = `last updated ${ts}`;

        cardGrid.innerHTML = '';
        const keys = Object.keys(snapshot).filter(k => k !== 'timestamp' && !DEDICATED_PAGE_PROVIDERS.has(k));
        if (keys.length === 0) {
          cardGrid.innerHTML = '<div class="empty-state">No diagnostics providers registered.</div>';
          return;
        }
        keys.forEach(key => cardGrid.appendChild(buildCard(key, snapshot[key])));
      }

      function setConn(state) {
        connPill.className = 'conn-pill ' + state;
        connLabel.textContent = state === 'live' ? 'Live' : state === 'down' ? 'Disconnected' : 'Connecting…';
      }

      let socket = null;
      let retryDelay = 1000;

      function connect() {
        // Resolve "ws" relative to the current document location rather than
        // hardcoding an absolute "/diagnostics/ws". This page may be served
        // directly (http://host:8502/diagnostics/) or via Home Assistant's
        // ingress proxy (https://ha/api/hassio_ingress/<token>/diagnostics/) —
        // the relative resolution lands correctly on both.
        const wsUrl = new URL('ws', location.href);
        wsUrl.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(wsUrl.href);

        socket.onopen = () => { setConn('live'); retryDelay = 1000; };
        socket.onmessage = (evt) => {
          try { render(JSON.parse(evt.data)); } catch (e) { console.error('Bad diagnostics payload', e); }
        };
        socket.onclose = () => {
          setConn('down');
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 1.5, 15000);
        };
        socket.onerror = () => socket.close();
      }

      connect();
    })();
  </script>

</body>

</html>
